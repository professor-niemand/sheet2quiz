<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F7F7F5"> <!-- browser toolbar colour; theme.js keeps it in step with the theme -->
  <meta name="description" content="Open-source quizzes and flashcards from your own spreadsheets. Works offline.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <!-- Applies the saved colour theme before the page paints, so there is no flash of the wrong colours -->
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <title>Sheet2Quiz</title>
</head>
<body>
  <!-- App bar: shown on every screen. Brand returns home; the theme button cycles themes (see js/app.js) -->
  <header class="appbar">
    <button type="button" class="brand" id="brand" aria-label="Sheet2Quiz, go to the home screen">
      <img src="icons/icon.svg" alt="" width="28" height="28">
      <span>Sheet2Quiz</span>
    </button>
    <button type="button" class="theme-btn" id="themeBtn"></button>
  </header>

  <!-- Every screen (view) is drawn into this element by js/ui.js mount() -->
  <main id="app" class="container"><p class="muted">Loading…</p></main>
  <noscript>Sheet2Quiz needs JavaScript to run.</noscript>

  <!-- Third-party parsers, committed in web/vendor so import works offline (licences are alongside) -->
  <script src="vendor/papaparse.min.js"></script>        <!-- CSV / TSV -->
  <script src="vendor/read-excel-file.min.js"></script>  <!-- XLSX -->
  <!-- The app itself: an ES module that loads everything else -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
